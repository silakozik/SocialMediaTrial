<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <section id="login-screen" class="auth-screen">
    <div class="auth-card">
      <h1>Giriş yap</h1>
      <p class="subtitle">Hesabına devam et</p>
      <div id="login-error" class="error hidden"></div>
      <form id="login-form">
        <label for="login-email">E-posta</label>
        <input type="email" id="login-email" name="email" required placeholder="ornek@email.com" />
        <label for="login-password">Şifre</label>
        <input type="password" id="login-password" name="password" required />
        <button type="submit">Giriş yap</button>
      </form>
      <p class="toggle-mode">Hesabın yok mu? <a href="#" id="go-register">Kayıt ol</a></p>
    </div>
  </section>

  <section id="register-screen" class="auth-screen hidden">
    <div class="auth-card">
      <h1>Kayıt ol</h1>
      <p class="subtitle">Yeni hesap oluştur</p>
      <div id="register-error" class="error hidden"></div>
      <form id="register-form">
        <label for="register-email">E-posta</label>
        <input type="email" id="register-email" name="email" required placeholder="ornek@email.com" />
        <label for="register-password">Şifre</label>
        <input type="password" id="register-password" name="password" required minlength="8" />
        <button type="submit">Kayıt ol</button>
      </form>
      <p class="toggle-mode">Zaten hesabın var mı? <a href="#" id="go-login">Giriş yap</a></p>
    </div>
  </section>

  <main id="app-screen" class="app-shell hidden">
    <header class="app-header">
      <h1>Social Feed</h1>
      <div class="user-actions">
        <button type="button" class="btn btn-primary" id="btn-refresh">Yenile</button>
        <button type="button" class="btn btn-ghost" id="btn-logout">Çıkış</button>
      </div>
    </header>

    <div class="upload-area">
      <form id="upload-form">
        <input type="file" id="upload-file" name="file" accept="image/*,video/*" required />
        <textarea id="upload-caption" name="caption" placeholder="Bir açıklama yaz..."></textarea>
        <button type="submit" class="btn btn-primary">Paylaş</button>
      </form>
      <p id="upload-status" class="upload-status"></p>
    </div>

    <div id="feed-container">
      <div id="loading-feed" class="loading-feed">Yükleniyor...</div>
      <div id="empty-feed" class="empty-feed hidden">Henüz paylaşım yok. İlk paylaşımı sen yap!</div>
      <div id="feed" class="feed hidden"></div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
